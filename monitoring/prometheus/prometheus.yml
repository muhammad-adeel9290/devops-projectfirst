global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - "alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

scrape_configs:
  - job_name: 'devops-server-monitor'
    metrics_path: '/metrics'
    scrape_interval: 5s
    static_configs:
      - targets: ['app:3000']
        labels:
          environment: 'local-docker'
          service: 'server-monitor'

  - job_name: 'prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['localhost:9090']

