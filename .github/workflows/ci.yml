name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  project-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Project files:"
          find . -type f \
            ! -path './.git/*' \
            ! -path './.github/*'

      - name: CI Success
        run: echo "CI pipeline completed successfully!"
