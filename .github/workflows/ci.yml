name: Enterprise DevSecOps CI Pipeline

on:
  push:
    branches:
      - main
      - 'agents/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================================================
  # 1. Code Quality & Automated Tests
  # ============================================================================
  test-and-lint:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Automated Unit Tests
        run: npm test

      - name: ShellCheck Bash Scripts
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: >-
            node_modules
            .git

      - name: Execute Server Health Check Script (Regression Test)
        run: |
          chmod +x server_health_check.sh
          ./server_health_check.sh

  # ============================================================================
  # 2. DevSecOps Security Scans (SAST, Secrets, Dependencies)
  # ============================================================================
  security-scan:
    name: DevSecOps Vulnerability & Secret Scan
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Run Trivy Vulnerability Scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ============================================================================
  # 3. Secure Container Build & Publish
  # ============================================================================
  build-and-publish:
    name: Build & Publish Container Image
    runs-on: ubuntu-latest
    needs: [test-and-lint, security-scan]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up QEMU (Multi-Arch Support)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (Conditional)
        if: github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Local Image for Trivy Scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: devops-server-monitor:test

      - name: Run Trivy Container Vulnerability Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'devops-server-monitor:test'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Build and Push Multi-Arch Image
        if: github.ref == 'refs/heads/main' && secrets.DOCKERHUB_USERNAME != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            adeel74954/devops-projectfirst:latest
            adeel74954/devops-projectfirst:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
